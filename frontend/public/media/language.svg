<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" style="background:#F9FBF8">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004169"/>
      <stop offset="100%" stop-color="#007DAF"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F9FB6"/>
      <stop offset="100%" stop-color="#79C8C2"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006491"/>
      <stop offset="100%" stop-color="#0F9FB6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <text x="450" y="38" text-anchor="middle" fill="#004169" font-size="22" font-family="system-ui" font-weight="800">
    Natural Language Processing Tasks
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#006491" opacity="0.6" font-size="13" font-family="system-ui">
    From raw text to understanding — each task addresses a different dimension of language
    <animate attributeName="opacity" values="0;0.6" dur="1s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Center hub pulse ring -->
  <circle cx="450" cy="280" r="65" fill="none" stroke="url(#g1)" stroke-width="1" opacity="0">
    <animate attributeName="r" values="65;85;65" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0;0.15;0" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="450" cy="280" r="65" fill="url(#g1)" opacity="0.08" stroke="url(#g1)" stroke-width="2">
    <animate attributeName="r" values="65;70;65" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.08;0" dur="0.5s" fill="freeze"/>
  </circle>
  <text x="450" y="272" text-anchor="middle" fill="#004169" font-size="17" font-family="system-ui" font-weight="800">
    NLP
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze"/>
  </text>
  <text x="450" y="295" text-anchor="middle" fill="#004169" font-size="11" font-family="system-ui" opacity="0.6">
    Understanding
    <animate attributeName="opacity" values="0;0.6" dur="0.5s" begin="0.8s" fill="freeze"/>
  </text>

  <!-- NER -->
  <g>
    <circle cx="160" cy="130" r="48" fill="url(#g1)" opacity="0.12" stroke="url(#g1)" stroke-width="1.5">
      <animate attributeName="r" values="48;52;48" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.12" dur="0.5s" begin="0.2s" fill="freeze"/>
    </circle>
    <text x="160" y="125" text-anchor="middle" fill="#004169" font-size="13" font-family="system-ui" font-weight="700">
      Named Entity
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>
    </text>
    <text x="160" y="145" text-anchor="middle" fill="#004169" font-size="13" font-family="system-ui" font-weight="700">
      Recognition
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="160" y="168" text-anchor="middle" fill="#006491" font-size="10" font-family="system-ui">
      People, places, orgs
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    </text>
    <!-- Animated flow line to hub -->
    <line x1="160" y1="160" x2="395" y2="250" stroke="#004169" stroke-width="1.5" stroke-dasharray="4,6" opacity="0">
      <animate attributeName="opacity" values="0;0.2;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Summarization -->
  <g>
    <circle cx="740" cy="130" r="48" fill="url(#g2)" opacity="0.12" stroke="url(#g2)" stroke-width="1.5">
      <animate attributeName="r" values="48;53;48" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0;0.12" dur="0.5s" begin="0.4s" fill="freeze"/>
    </circle>
    <text x="740" y="125" text-anchor="middle" fill="#0F9FB6" font-size="13" font-family="system-ui" font-weight="700">
      Automatic
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    </text>
    <text x="740" y="145" text-anchor="middle" fill="#0F9FB6" font-size="13" font-family="system-ui" font-weight="700">
      Summarisation
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/>
    </text>
    <text x="740" y="168" text-anchor="middle" fill="#006491" font-size="10" font-family="system-ui">
      Condense long text
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
    </text>
    <line x1="692" y1="160" x2="505" y2="250" stroke="#0F9FB6" stroke-width="1.5" stroke-dasharray="4,6" opacity="0">
      <animate attributeName="opacity" values="0;0.2;0" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Translation -->
  <g>
    <circle cx="110" cy="400" r="48" fill="url(#g3)" opacity="0.12" stroke="url(#g3)" stroke-width="1.5">
      <animate attributeName="r" values="48;51;48" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;0.12" dur="0.5s" begin="0.6s" fill="freeze"/>
    </circle>
    <text x="110" y="395" text-anchor="middle" fill="#006491" font-size="13" font-family="system-ui" font-weight="700">
      Machine
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
    </text>
    <text x="110" y="415" text-anchor="middle" fill="#006491" font-size="13" font-family="system-ui" font-weight="700">
      Translation
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze"/>
    </text>
    <text x="110" y="438" text-anchor="middle" fill="#006491" font-size="10" font-family="system-ui">
      Between languages
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1s" fill="freeze"/>
    </text>
    <line x1="158" y1="360" x2="395" y2="310" stroke="#006491" stroke-width="1.5" stroke-dasharray="4,6" opacity="0">
      <animate attributeName="opacity" values="0;0.2;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Classification -->
  <g>
    <circle cx="790" cy="400" r="48" fill="url(#g1)" opacity="0.12" stroke="url(#g1)" stroke-width="1.5">
      <animate attributeName="r" values="48;50;48" dur="3.2s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0;0.12" dur="0.5s" begin="0.8s" fill="freeze"/>
    </circle>
    <text x="790" y="395" text-anchor="middle" fill="#004169" font-size="13" font-family="system-ui" font-weight="700">
      Text
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1s" fill="freeze"/>
    </text>
    <text x="790" y="415" text-anchor="middle" fill="#004169" font-size="13" font-family="system-ui" font-weight="700">
      Classification
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/>
    </text>
    <text x="790" y="438" text-anchor="middle" fill="#006491" font-size="10" font-family="system-ui">
      Positive/negative
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
    </text>
    <line x1="742" y1="360" x2="505" y2="310" stroke="#004169" stroke-width="1.5" stroke-dasharray="4,6" opacity="0">
      <animate attributeName="opacity" values="0;0.2;0" dur="2.8s" begin="2.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Speech Recognition -->
  <g>
    <circle cx="310" cy="110" r="42" fill="url(#g2)" opacity="0.1" stroke="url(#g2)" stroke-width="1.5">
      <animate attributeName="r" values="42;46;42" dur="3.8s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0;0.1" dur="0.5s" begin="0.3s" fill="freeze"/>
    </circle>
    <text x="310" y="108" text-anchor="middle" fill="#0F9FB6" font-size="12" font-family="system-ui" font-weight="700">
      Speech
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="310" y="126" text-anchor="middle" fill="#0F9FB6" font-size="12" font-family="system-ui" font-weight="700">
      Recognition
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    </text>
  </g>

  <!-- Language ID -->
  <g>
    <circle cx="590" cy="110" r="42" fill="url(#g3)" opacity="0.1" stroke="url(#g3)" stroke-width="1.5">
      <animate attributeName="r" values="42;45;42" dur="4.2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="0;0.1" dur="0.5s" begin="0.5s" fill="freeze"/>
    </circle>
    <text x="590" y="108" text-anchor="middle" fill="#006491" font-size="12" font-family="system-ui" font-weight="700">
      Language
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/>
    </text>
    <text x="590" y="126" text-anchor="middle" fill="#006491" font-size="12" font-family="system-ui" font-weight="700">
      Identification
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
    </text>
  </g>

  <!-- Word Sense -->
  <g>
    <circle cx="180" cy="270" r="36" fill="url(#g1)" opacity="0.08" stroke="url(#g1)" stroke-width="1">
      <animate attributeName="r" values="36;40;36" dur="3.6s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="0;0.08" dur="0.5s" begin="1s" fill="freeze"/>
    </circle>
    <text x="180" y="268" text-anchor="middle" fill="#004169" font-size="11" font-family="system-ui" font-weight="600">
      Word Sense
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
    </text>
    <text x="180" y="283" text-anchor="middle" fill="#004169" font-size="11" font-family="system-ui" font-weight="600">
      Disambiguation
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
    </text>
  </g>

  <!-- Information Extraction -->
  <g>
    <circle cx="720" cy="280" r="36" fill="url(#g2)" opacity="0.08" stroke="url(#g2)" stroke-width="1">
      <animate attributeName="r" values="36;39;36" dur="4.1s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0;0.08" dur="0.5s" begin="1.2s" fill="freeze"/>
    </circle>
    <text x="720" y="275" text-anchor="middle" fill="#0F9FB6" font-size="11" font-family="system-ui" font-weight="600">
      Information
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
    </text>
    <text x="720" y="291" text-anchor="middle" fill="#0F9FB6" font-size="11" font-family="system-ui" font-weight="600">
      Extraction
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/>
    </text>
  </g>

  <!-- Connection lines draw themselves -->
  <g stroke="#004169" stroke-width="1.5" opacity="0.15">
    <line x1="208" y1="168" x2="395" y2="245" stroke-dasharray="300" stroke-dashoffset="300">
      <animate attributeName="stroke-dashoffset" values="300;0" dur="0.8s" begin="0.5s" fill="freeze"/>
    </line>
    <line x1="692" y1="168" x2="505" y2="245" stroke-dasharray="300" stroke-dashoffset="300">
      <animate attributeName="stroke-dashoffset" values="300;0" dur="0.8s" begin="0.7s" fill="freeze"/>
    </line>
    <line x1="158" y1="355" x2="395" y2="310" stroke-dasharray="300" stroke-dashoffset="300">
      <animate attributeName="stroke-dashoffset" values="300;0" dur="0.8s" begin="0.9s" fill="freeze"/>
    </line>
    <line x1="742" y1="355" x2="505" y2="310" stroke-dasharray="300" stroke-dashoffset="300">
      <animate attributeName="stroke-dashoffset" values="300;0" dur="0.8s" begin="1.1s" fill="freeze"/>
    </line>
    <line x1="350" y1="140" x2="410" y2="225" stroke-dasharray="120" stroke-dashoffset="120">
      <animate attributeName="stroke-dashoffset" values="120;0" dur="0.6s" begin="0.6s" fill="freeze"/>
    </line>
    <line x1="548" y1="140" x2="490" y2="225" stroke-dasharray="120" stroke-dashoffset="120">
      <animate attributeName="stroke-dashoffset" values="120;0" dur="0.6s" begin="0.8s" fill="freeze"/>
    </line>
    <line x1="215" y1="250" x2="395" y2="268" stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" values="200;0" dur="0.6s" begin="1s" fill="freeze"/>
    </line>
    <line x1="685" y1="265" x2="505" y2="272" stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" values="200;0" dur="0.6s" begin="1.2s" fill="freeze"/>
    </line>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 485)">
    <rect x="0" y="0" width="840" height="52" rx="8" fill="white" stroke="#004169" stroke-opacity="0.06" stroke-width="1">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.6s" fill="freeze"/>
    </rect>
    <circle cx="20" cy="16" r="5" fill="url(#g1)">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>
    </circle>
    <text x="32" y="20" fill="#004169" font-size="11" font-family="system-ui">
      Text-based tasks
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.9s" fill="freeze"/>
    </text>
    <circle cx="200" cy="16" r="5" fill="url(#g2)">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2s" fill="freeze"/>
    </circle>
    <text x="212" y="20" fill="#0F9FB6" font-size="11" font-family="system-ui">
      Summarisation &amp; generation
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.1s" fill="freeze"/>
    </text>
    <circle cx="440" cy="16" r="5" fill="url(#g3)">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.2s" fill="freeze"/>
    </circle>
    <text x="452" y="20" fill="#006491" font-size="11" font-family="system-ui">
      Cross-modal &amp; analysis
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.3s" fill="freeze"/>
    </text>
    <text x="420" y="42" text-anchor="middle" fill="#004169" font-size="10" font-family="system-ui" opacity="0.5">
      Each task requires a different combination of syntax, semantics, and world knowledge
      <animate attributeName="opacity" values="0;0.5" dur="0.5s" begin="2.4s" fill="freeze"/>
    </text>
  </g>
</svg>
