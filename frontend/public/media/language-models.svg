<svg viewBox="0 0 850 520" xmlns="http://www.w3.org/2000/svg" style="background:#F9FBF8">
  <defs>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004169"/>
      <stop offset="100%" stop-color="#007DAF"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F9FB6"/>
      <stop offset="100%" stop-color="#79C8C2"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006491"/>
      <stop offset="100%" stop-color="#0F9FB6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <text x="425" y="38" text-anchor="middle" fill="#004169" font-size="20" font-family="system-ui" font-weight="700">
    Next-Token Prediction
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
  </text>
  <text x="425" y="60" text-anchor="middle" fill="#006491" opacity="0.6" font-size="14" font-family="system-ui">
    The model predicts the most probable next word
    <animate attributeName="opacity" values="0;0.6" dur="0.6s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Input tokens row with sequential reveal -->
  <g transform="translate(0, 90)">
    <rect x="40" y="0" width="95" height="55" rx="8" fill="white" stroke="#004169" stroke-opacity="0.2" stroke-width="1.5" transform="translate(-20,0)">
      <animate attributeName="transform" values="translate(-20,0);translate(0,0)" dur="0.4s" begin="0.2s" fill="freeze" type="translate"/>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="87" y="33" text-anchor="middle" fill="#004169" font-size="16" font-family="system-ui" font-weight="700">
      The
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.3s" fill="freeze"/>
    </text>

    <rect x="148" y="0" width="95" height="55" rx="8" fill="white" stroke="#004169" stroke-opacity="0.2" stroke-width="1.5" transform="translate(-15,0)">
      <animate attributeName="transform" values="translate(-15,0);translate(0,0)" dur="0.4s" begin="0.4s" fill="freeze" type="translate"/>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>
    </rect>
    <text x="195" y="33" text-anchor="middle" fill="#004169" font-size="16" font-family="system-ui" font-weight="700">
      cat
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    </text>

    <rect x="256" y="0" width="95" height="55" rx="8" fill="white" stroke="#004169" stroke-opacity="0.2" stroke-width="1.5" transform="translate(-10,0)">
      <animate attributeName="transform" values="translate(-10,0);translate(0,0)" dur="0.4s" begin="0.6s" fill="freeze" type="translate"/>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="303" y="33" text-anchor="middle" fill="#004169" font-size="16" font-family="system-ui" font-weight="700">
      sat
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.7s" fill="freeze"/>
    </text>

    <rect x="364" y="0" width="95" height="55" rx="8" fill="white" stroke="#004169" stroke-opacity="0.2" stroke-width="1.5" transform="translate(-5,0)">
      <animate attributeName="transform" values="translate(-5,0);translate(0,0)" dur="0.4s" begin="0.8s" fill="freeze" type="translate"/>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
    </rect>
    <text x="411" y="33" text-anchor="middle" fill="#004169" font-size="16" font-family="system-ui" font-weight="700">
      on
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
    </text>

    <rect x="472" y="0" width="95" height="55" rx="8" fill="white" stroke="#0F9FB6" stroke-opacity="0.15" stroke-width="1.5">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1s" fill="freeze"/>
    </rect>
    <text x="519" y="33" text-anchor="middle" fill="#0F9FB6" font-size="16" font-family="system-ui" font-weight="700">
      the
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    </text>

    <!-- Animated cursor blinks -->
    <rect x="585" y="-5" width="95" height="65" rx="10" fill="#0F9FB6" opacity="0.08" stroke="#0F9FB6" stroke-width="2" stroke-dasharray="6,4">
      <animate attributeName="opacity" values="0;0.08" dur="0.3s" begin="1.2s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
    </rect>
    <text x="632" y="28" text-anchor="middle" fill="#0F9FB6" font-size="12" font-family="system-ui" font-weight="600">
      ?
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>
    </text>
  </g>

  <!-- Arrow down -->
  <g transform="translate(632, 150)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#0F9FB6" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.4" dur="0.3s" begin="1.6s" fill="freeze"/>
      <animate attributeName="y2" values="30;40;30" dur="2s" repeatCount="indefinite" begin="1.6s"/>
    </line>
    <polygon points="0,35 -5,27 5,27" fill="#0F9FB6" opacity="0">
      <animate attributeName="opacity" values="0;0.4" dur="0.3s" begin="1.7s" fill="freeze"/>
    </polygon>
  </g>

  <!-- Probability bars -->
  <g transform="translate(0, 195)">
    <rect x="470" y="0" width="210" height="40" rx="6" fill="#004169" opacity="0.04">
      <animate attributeName="opacity" values="0;0.04" dur="0.4s" begin="1.8s" fill="freeze"/>
    </rect>
    <text x="475" y="25" fill="#004169" font-size="13" font-family="system-ui" font-weight="600" opacity="0.5">
      Next-token probability distribution
      <animate attributeName="opacity" values="0;0.5" dur="0.4s" begin="1.9s" fill="freeze"/>
    </text>

    <!-- mat -->
    <rect x="575" y="120" width="90" height="0" rx="8" fill="url(#bar1)" opacity="0">
      <animate attributeName="height" values="0;70" dur="0.5s" begin="2s" fill="freeze"/>
      <animate attributeName="y" values="120;50" dur="0.5s" begin="2s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="2s" fill="freeze"/>
      <animate attributeName="height" values="70;75;70" dur="2.5s" repeatCount="indefinite" begin="2.5s"/>
      <animate attributeName="y" values="50;45;50" dur="2.5s" repeatCount="indefinite" begin="2.5s"/>
    </rect>
    <text x="620" y="135" text-anchor="middle" fill="#004169" font-size="15" font-family="system-ui" font-weight="700" filter="url(#glow)">
      mat
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.2s" fill="freeze"/>
    </text>
    <text x="620" y="155" text-anchor="middle" fill="#004169" font-size="13" font-family="system-ui" opacity="0.4">
      0.73
      <animate attributeName="opacity" values="0;0.4" dur="0.3s" begin="2.4s" fill="freeze"/>
    </text>

    <!-- rug -->
    <rect x="675" y="120" width="80" height="0" rx="8" fill="url(#bar2)" opacity="0">
      <animate attributeName="height" values="0;52" dur="0.4s" begin="2.2s" fill="freeze"/>
      <animate attributeName="y" values="120;68" dur="0.4s" begin="2.2s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.7" dur="0.3s" begin="2.2s" fill="freeze"/>
      <animate attributeName="height" values="52;57;52" dur="3s" repeatCount="indefinite" begin="2.7s"/>
      <animate attributeName="y" values="68;63;68" dur="3s" repeatCount="indefinite" begin="2.7s"/>
    </rect>
    <text x="715" y="135" text-anchor="middle" fill="#0F9FB6" font-size="15" font-family="system-ui" font-weight="600">
      rug
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.5s" fill="freeze"/>
    </text>
    <text x="715" y="155" text-anchor="middle" fill="#0F9FB6" font-size="13" font-family="system-ui" opacity="0.4">
      0.12
      <animate attributeName="opacity" values="0;0.4" dur="0.3s" begin="2.7s" fill="freeze"/>
    </text>

    <!-- chair -->
    <rect x="765" y="120" width="72" height="0" rx="8" fill="url(#bar3)" opacity="0">
      <animate attributeName="height" values="0;35" dur="0.3s" begin="2.4s" fill="freeze"/>
      <animate attributeName="y" values="120;85" dur="0.3s" begin="2.4s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.6" dur="0.3s" begin="2.4s" fill="freeze"/>
      <animate attributeName="height" values="35;40;35" dur="3.5s" repeatCount="indefinite" begin="2.9s"/>
      <animate attributeName="y" values="85;80;85" dur="3.5s" repeatCount="indefinite" begin="2.9s"/>
    </rect>
    <text x="801" y="135" text-anchor="middle" fill="#006491" font-size="15" font-family="system-ui" font-weight="600">
      chair
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.6s" fill="freeze"/>
    </text>
    <text x="801" y="155" text-anchor="middle" fill="#006491" font-size="13" font-family="system-ui" opacity="0.4">
      0.06
      <animate attributeName="opacity" values="0;0.4" dur="0.3s" begin="2.8s" fill="freeze"/>
    </text>
  </g>

  <!-- Temperature slider -->
  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="280" height="18" rx="9" fill="#004169" opacity="0.06">
      <animate attributeName="opacity" values="0;0.06" dur="0.4s" begin="2.5s" fill="freeze"/>
    </rect>
    <circle cx="70" cy="9" r="11" fill="#004169" opacity="0.3">
      <animate attributeName="opacity" values="0;0.3" dur="0.3s" begin="2.6s" fill="freeze"/>
      <animate attributeName="cx" values="70;140;70" dur="4s" repeatCount="indefinite" begin="3s"/>
    </circle>
    <text x="10" y="38" fill="#004169" font-size="13" font-family="system-ui" opacity="0.4">
      Low temperature
      <animate attributeName="opacity" values="0;0.4" dur="0.3s" begin="2.7s" fill="freeze"/>
    </text>
    <text x="200" y="38" fill="#004169" font-size="13" font-family="system-ui" opacity="0.4">
      High temperature
      <animate attributeName="opacity" values="0;0.4" dur="0.3s" begin="2.8s" fill="freeze"/>
    </text>
    <text x="140" y="58" text-anchor="middle" fill="#004169" font-size="12" font-family="system-ui" font-weight="600" opacity="0.5">
      Temperature controls randomness of generation
      <animate attributeName="opacity" values="0;0.5" dur="0.4s" begin="2.9s" fill="freeze"/>
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="310" height="70" rx="8" fill="white" stroke="#004169" stroke-opacity="0.08" stroke-width="1" transform="translate(-10,0)">
      <animate attributeName="transform" values="translate(-10,0);translate(0,0)" dur="0.4s" begin="3s" fill="freeze" type="translate"/>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3s" fill="freeze"/>
    </rect>
    <rect x="15" y="15" width="28" height="14" rx="4" fill="url(#bar1)">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.1s" fill="freeze"/>
    </rect>
    <text x="52" y="28" fill="#004169" font-size="13" font-family="system-ui" font-weight="600">
      Higher probability → word likely to follow
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.2s" fill="freeze"/>
    </text>
    <rect x="15" y="42" width="28" height="14" rx="4" fill="url(#bar2)">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.3s" fill="freeze"/>
    </rect>
    <text x="52" y="55" fill="#004169" font-size="13" font-family="system-ui">
      Lower probability → unlikely but possible
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.4s" fill="freeze"/>
    </text>
  </g>

  <!-- Perplexity indicator -->
  <g transform="translate(420, 340)">
    <rect x="0" y="0" width="380" height="70" rx="8" fill="white" stroke="#004169" stroke-opacity="0.08" stroke-width="1" transform="translate(10,0)">
      <animate attributeName="transform" values="translate(10,0);translate(0,0)" dur="0.4s" begin="3s" fill="freeze" type="translate"/>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3s" fill="freeze"/>
    </rect>
    <text x="190" y="22" text-anchor="middle" fill="#004169" font-size="14" font-family="system-ui" font-weight="700">
      Perplexity = 3.4
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.2s" fill="freeze"/>
    </text>
    <text x="190" y="42" text-anchor="middle" fill="#006491" font-size="12" font-family="system-ui" opacity="0.6">
      Model is as confused as picking from 3.4 options
      <animate attributeName="opacity" values="0;0.6" dur="0.3s" begin="3.4s" fill="freeze"/>
    </text>
    <rect x="40" y="52" width="300" height="8" rx="4" fill="#004169" opacity="0.08">
      <animate attributeName="opacity" values="0;0.08" dur="0.3s" begin="3.5s" fill="freeze"/>
    </rect>
    <rect x="40" y="52" width="0" height="8" rx="4" fill="#79C8C2" opacity="0.6">
      <animate attributeName="width" values="0;80" dur="0.5s" begin="3.5s" fill="freeze"/>
      <animate attributeName="width" values="80;95;80" dur="3s" repeatCount="indefinite" begin="4s"/>
    </rect>
  </g>
</svg>
