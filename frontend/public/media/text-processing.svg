<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" style="background:#F9FBF8">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004169"/>
      <stop offset="100%" stop-color="#007DAF"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F9FB6"/>
      <stop offset="100%" stop-color="#79C8C2"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006491"/>
      <stop offset="100%" stop-color="#0F9FB6"/>
    </linearGradient>
  </defs>

  <text x="450" y="38" text-anchor="middle" fill="#004169" font-size="22" font-family="system-ui" font-weight="800">
    Text Processing Pipeline
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
  </text>
  <text x="450" y="62" text-anchor="middle" fill="#006491" opacity="0.6" font-size="13" font-family="system-ui">
    Raw text is converted into numbers through a series of processing stages
    <animate attributeName="opacity" values="0;0.6" dur="0.8s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Stage 1: Raw Text -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="160" height="75" rx="10" fill="white" stroke="#004169" stroke-opacity="0.15" stroke-width="1.5">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="80" y="25" text-anchor="middle" fill="#004169" font-size="13" font-family="system-ui" font-weight="700">
      Raw Text
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="80" y="45" text-anchor="middle" fill="#006491" font-size="11" font-family="system-ui">
      "The cat sat
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.4s" fill="freeze"/>
    </text>
    <text x="80" y="62" text-anchor="middle" fill="#006491" font-size="11" font-family="system-ui">
      on the mat."
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    </text>
  </g>

  <!-- Arrow 1: animated dashes -->
  <g transform="translate(210, 130)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#0F9FB6" stroke-width="2.5" stroke-dasharray="6,6" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <polygon points="45,-5 55,0 45,5" fill="#0F9FB6" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Stage 2: Tokenization -->
  <g transform="translate(260, 100)">
    <rect x="0" y="0" width="180" height="75" rx="10" fill="url(#g1)" opacity="0.06" stroke="url(#g1)" stroke-width="1.5">
      <animate attributeName="opacity" values="0;0.06" dur="0.5s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="90" y="25" text-anchor="middle" fill="#004169" font-size="13" font-family="system-ui" font-weight="700">
      Tokenization
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
    </text>
    <!-- Token chips that slide in -->
    <g>
      <rect x="12" y="35" width="28" height="22" rx="4" fill="url(#g1)" opacity="0.12" transform="translate(-30,0)">
        <animate attributeName="transform" values="translate(-30,0);translate(0,0)" dur="0.4s" begin="0.7s" fill="freeze" type="translate"/>
      </rect>
      <text x="26" y="50" text-anchor="middle" fill="#004169" font-size="10" font-family="system-ui" font-weight="600">
        The
        <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.7s" fill="freeze"/>
      </text>
      <rect x="44" y="35" width="28" height="22" rx="4" fill="url(#g1)" opacity="0.12" transform="translate(-20,0)">
        <animate attributeName="transform" values="translate(-20,0);translate(0,0)" dur="0.4s" begin="0.85s" fill="freeze" type="translate"/>
      </rect>
      <text x="58" y="50" text-anchor="middle" fill="#004169" font-size="10" font-family="system-ui" font-weight="600">
        cat
        <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.85s" fill="freeze"/>
      </text>
      <rect x="76" y="35" width="28" height="22" rx="4" fill="url(#g1)" opacity="0.12" transform="translate(-10,0)">
        <animate attributeName="transform" values="translate(-10,0);translate(0,0)" dur="0.4s" begin="1s" fill="freeze" type="translate"/>
      </rect>
      <text x="90" y="50" text-anchor="middle" fill="#004169" font-size="10" font-family="system-ui" font-weight="600">
        sat
        <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1s" fill="freeze"/>
      </text>
      <rect x="108" y="35" width="26" height="22" rx="4" fill="url(#g1)" opacity="0.12" transform="translate(-5,0)">
        <animate attributeName="transform" values="translate(-5,0);translate(0,0)" dur="0.4s" begin="1.15s" fill="freeze" type="translate"/>
      </rect>
      <text x="121" y="50" text-anchor="middle" fill="#004169" font-size="10" font-family="system-ui" font-weight="600">
        on
        <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.15s" fill="freeze"/>
      </text>
      <rect x="138" y="35" width="30" height="22" rx="4" fill="url(#g1)" opacity="0.12" transform="translate(-5,0)">
        <animate attributeName="transform" values="translate(-5,0);translate(0,0)" dur="0.4s" begin="1.3s" fill="freeze" type="translate"/>
      </rect>
      <text x="153" y="50" text-anchor="middle" fill="#004169" font-size="10" font-family="system-ui" font-weight="600">
        mat
        <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.3s" fill="freeze"/>
      </text>
    </g>
  </g>

  <!-- Arrow 2: animated dashes -->
  <g transform="translate(440, 130)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#0F9FB6" stroke-width="2.5" stroke-dasharray="6,6" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
    </line>
    <polygon points="45,-5 55,0 45,5" fill="#0F9FB6" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Stage 3: Bag of Words with count animation -->
  <g transform="translate(490, 100)">
    <rect x="0" y="0" width="180" height="75" rx="10" fill="url(#g2)" opacity="0.06" stroke="url(#g2)" stroke-width="1.5">
      <animate attributeName="opacity" values="0;0.06" dur="0.5s" begin="0.8s" fill="freeze"/>
    </rect>
    <text x="90" y="25" text-anchor="middle" fill="#0F9FB6" font-size="13" font-family="system-ui" font-weight="700">
      Bag of Words
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
    </text>
    <text x="15" y="46" fill="#004169" font-size="11" font-family="system-ui">
      the: <tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>2</tspan>, cat: <tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>1</tspan>, sat: <tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>1</tspan>,
    </text>
    <text x="15" y="63" fill="#004169" font-size="11" font-family="system-ui">
      on: <tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>1</tspan>, mat: <tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.6s" fill="freeze"/>1</tspan>
    </text>
  </g>

  <!-- Arrow 3: animated dashes -->
  <g transform="translate(670, 130)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#0F9FB6" stroke-width="2.5" stroke-dasharray="6,6" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" begin="2s" repeatCount="indefinite"/>
    </line>
    <polygon points="40,-5 50,0 40,5" fill="#0F9FB6" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" begin="2s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Stage 4: TF-IDF -->
  <g transform="translate(718, 100)">
    <rect x="0" y="0" width="150" height="75" rx="10" fill="url(#g3)" opacity="0.06" stroke="url(#g3)" stroke-width="1.5">
      <animate attributeName="opacity" values="0;0.06" dur="0.5s" begin="1s" fill="freeze"/>
    </rect>
    <text x="75" y="25" text-anchor="middle" fill="#006491" font-size="13" font-family="system-ui" font-weight="700">
      TF-IDF
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    </text>
    <text x="10" y="46" fill="#004169" font-size="10" font-family="system-ui">
      Term freq × inverse
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
    </text>
    <text x="10" y="63" fill="#004169" font-size="10" font-family="system-ui">
      document frequency
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>
    </text>
  </g>

  <!-- Preprocessing Steps panel -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="800" height="310" rx="12" fill="white" stroke="#004169" stroke-opacity="0.06" stroke-width="1">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.5s" fill="freeze"/>
    </rect>
    <text x="400" y="25" text-anchor="middle" fill="#004169" font-size="15" font-family="system-ui" font-weight="700">
      Preprocessing Steps
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
    </text>

    <!-- Lowercasing -->
    <g>
      <rect x="30" y="45" width="230" height="115" rx="8" fill="url(#g1)" opacity="0.04" stroke="url(#g1)" stroke-width="1">
        <animate attributeName="opacity" values="0;0.04" dur="0.4s" begin="1.7s" fill="freeze"/>
        <animate attributeName="y" values="55;45;55" dur="2s" begin="2.5s" repeatCount="indefinite" type="translate"/>
      </rect>
      <text x="145" y="70" text-anchor="middle" fill="#004169" font-size="13" font-family="system-ui" font-weight="700">
        Lowercasing
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>
      </text>
      <text x="40" y="92" fill="#004169" font-size="11" font-family="system-ui">
        "The" → "the"
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.9s" fill="freeze"/>
      </text>
      <text x="40" y="112" fill="#004169" font-size="11" font-family="system-ui">
        "Apple" → "apple"
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2s" fill="freeze"/>
      </text>
      <text x="40" y="132" fill="#006491" font-size="10" font-family="system-ui">
        Reduces vocabulary size
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.1s" fill="freeze"/>
      </text>
    </g>

    <!-- Stop Words -->
    <g>
      <rect x="280" y="45" width="230" height="115" rx="8" fill="url(#g2)" opacity="0.04" stroke="url(#g2)" stroke-width="1">
        <animate attributeName="opacity" values="0;0.04" dur="0.4s" begin="1.9s" fill="freeze"/>
        <animate attributeName="y" values="55;45;55" dur="2.5s" begin="3s" repeatCount="indefinite" type="translate"/>
      </rect>
      <text x="395" y="70" text-anchor="middle" fill="#0F9FB6" font-size="13" font-family="system-ui" font-weight="700">
        Stop Word Removal
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2s" fill="freeze"/>
      </text>
      <text x="290" y="92" fill="#004169" font-size="11" font-family="system-ui">
        Remove: "the", "is", "and"
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.1s" fill="freeze"/>
      </text>
      <text x="290" y="112" fill="#004169" font-size="11" font-family="system-ui">
        Keep content words only
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.2s" fill="freeze"/>
      </text>
      <text x="290" y="132" fill="#006491" font-size="10" font-family="system-ui">
        Reduces noise
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.3s" fill="freeze"/>
      </text>
    </g>

    <!-- Stemming -->
    <g>
      <rect x="530" y="45" width="240" height="115" rx="8" fill="url(#g3)" opacity="0.04" stroke="url(#g3)" stroke-width="1">
        <animate attributeName="opacity" values="0;0.04" dur="0.4s" begin="2.1s" fill="freeze"/>
        <animate attributeName="y" values="55;45;55" dur="3s" begin="3.5s" repeatCount="indefinite" type="translate"/>
      </rect>
      <text x="650" y="70" text-anchor="middle" fill="#006491" font-size="13" font-family="system-ui" font-weight="700">
        Stemming
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.2s" fill="freeze"/>
      </text>
      <text x="540" y="92" fill="#004169" font-size="11" font-family="system-ui">
        "running" → "run"
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.3s" fill="freeze"/>
      </text>
      <text x="540" y="112" fill="#004169" font-size="11" font-family="system-ui">
        "runner" → "run"
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.4s" fill="freeze"/>
      </text>
      <text x="540" y="132" fill="#006491" font-size="10" font-family="system-ui">
        Fast but can be imprecise
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.5s" fill="freeze"/>
      </text>
    </g>

    <text x="400" y="190" text-anchor="middle" fill="#004169" font-size="12" font-family="system-ui" font-weight="600">
      From Tokens to Vectors
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.6s" fill="freeze"/>
    </text>
    <text x="400" y="212" text-anchor="middle" fill="#006491" font-size="11" font-family="system-ui">
      Each preprocessing step transforms the text before it becomes numerical input
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.7s" fill="freeze"/>
    </text>
    <text x="400" y="232" text-anchor="middle" fill="#006491" font-size="11" font-family="system-ui">
      for machine learning models. The choices made here affect what the model can learn.
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze"/>
    </text>

    <!-- Document vector that types out -->
    <g transform="translate(320, 255)">
      <rect x="0" y="0" width="160" height="36" rx="6" fill="url(#g1)" opacity="0.1">
        <animate attributeName="opacity" values="0;0.1" dur="0.4s" begin="3s" fill="freeze"/>
      </rect>
      <text x="80" y="22" text-anchor="middle" fill="#004169" font-size="12" font-family="system-ui" font-weight="700">
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.2s" fill="freeze"/>[</tspan>
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.3s" fill="freeze"/>0</tspan>
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.4s" fill="freeze"/>, </tspan>
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.5s" fill="freeze"/>2</tspan>
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.6s" fill="freeze"/>, </tspan>
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.7s" fill="freeze"/>1</tspan>
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.8s" fill="freeze"/>, </tspan>
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="3.9s" fill="freeze"/>1</tspan>
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="4s" fill="freeze"/>, </tspan>
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="4.1s" fill="freeze"/>1</tspan>
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="4.2s" fill="freeze"/>, </tspan>
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="4.3s" fill="freeze"/>0</tspan>
        <tspan><animate attributeName="opacity" values="0;1" dur="0.15s" begin="4.4s" fill="freeze"/>]</tspan>
      </text>
    </g>
    <text x="400" y="305" text-anchor="middle" fill="#006491" font-size="10" font-family="system-ui" opacity="0.5">
      Document vector: each position counts how often a vocabulary word appears
      <animate attributeName="opacity" values="0;0.5" dur="0.5s" begin="4.5s" fill="freeze"/>
    </text>
  </g>
</svg>
